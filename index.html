<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Wish I Was A Seahorse</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.module.mjs"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>I Wish I Was A Seahorse</h1>
            <p>Talk to an AI who is certain it's a seahorse.</p>
        </header>
        <div id="chat-window">
            <div id="chat-messages">
                <div class="message ai-message">
                    <div class="avatar" style="background-image: url('seahorse-avatar.png')"></div>
                    <div class="message-content">
                        <p class="spoken-response">Hello there... I am a seahorse. You can talk to me.</p>
                    </div>
                </div>
            </div>
            <div id="thinking-indicator" class="hidden">
                <div class="message ai-message">
                    <div class="avatar" style="background-image: url('seahorse-avatar.png')"></div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <form id="chat-form">
            <input type="text" id="message-input" placeholder="What do you wish to say to the seahorse?" autocomplete="off" required>
            <button type="submit">Send</button>
        </form>
    </div>
    <script src="main.js" type="module"></script>

</body>
</html>
